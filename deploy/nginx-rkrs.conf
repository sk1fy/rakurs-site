# Include inside the server block whose root points to the uploaded dist/.
index index.html;
error_page 404 /404.html;

location = /cashback { return 301 /bonus; }
location = /partner_bonus { return 301 /bonus; }
location = /activity_control { return 301 /kontrol-aktivnosti; }
location = /top { return 301 "/widget_amocrm#top"; }
location = /rakurs-free-pack { return 301 "/widget_amocrm#free"; }

location / {
    try_files $uri $uri/index.html =404;
}
